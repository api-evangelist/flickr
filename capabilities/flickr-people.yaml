naftiko: 1.0.0-alpha2
info:
  label: Flickr API — People
  description: 'Photos — People. 3 operations. Lead operation: Get Person Info. Self-contained Naftiko capability covering one Flickr business surface.'
  tags:
    - Flickr
    - Photos
    - People
  created: '2026-05-30'
  modified: '2026-05-30'
binds:
  - namespace: env
    keys:
      FLICKR_API_KEY: FLICKR_API_KEY
capability:
  consumes:
    - type: http
      namespace: flickr-people
      baseUri: https://api.flickr.com/services
      description: Flickr API — People business capability. Self-contained, no shared references.
      authentication:
        type: apikey
        key: api_key
        value: '{{env.FLICKR_API_KEY}}'
        placement: query
      resources:
        - name: rest-flickr-people-getinfo
          path: /rest/flickr.people.getInfo
          operations:
            - name: peopleGetInfo
              method: GET
              description: Get Person Info
              inputParameters:
                - name: api_key
                  in: query
                  type: string
                  required: true
                  description: Application API key.
                - name: user_id
                  in: query
                  type: string
                  required: true
                  description: user_id
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: $.
        - name: rest-flickr-people-getphotos
          path: /rest/flickr.people.getPhotos
          operations:
            - name: peopleGetPhotos
              method: GET
              description: Get A User's Photos
              inputParameters:
                - name: api_key
                  in: query
                  type: string
                  required: true
                  description: Application API key.
                - name: user_id
                  in: query
                  type: string
                  required: true
                  description: user_id
                - name: extras
                  in: query
                  type: string
                  required: false
                  description: Comma-delimited list of extra fields (e.g. owner_name, url_o, geo).
                - name: page
                  in: query
                  type: integer
                  required: false
                  description: page
                - name: per_page
                  in: query
                  type: integer
                  required: false
                  description: per_page
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: $.
        - name: rest-flickr-people-findbyemail
          path: /rest/flickr.people.findByEmail
          operations:
            - name: peopleFindByEmail
              method: GET
              description: Find User By Email
              inputParameters:
                - name: api_key
                  in: query
                  type: string
                  required: true
                  description: Application API key.
                - name: find_email
                  in: query
                  type: string
                  required: true
                  description: find_email
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: $.
  exposes:
    - type: rest
      namespace: flickr-people-rest
      port: 8080
      description: REST adapter for Flickr API — People. One Spectral-compliant resource per consumed operation, prefixed with /v1.
      resources:
        - path: /v1/people/get-info
          name: rest-flickr-people-getinfo
          description: REST surface for Get Person Info.
          operations:
            - method: GET
              name: peopleGetInfo
              description: Get Person Info
              call: flickr-people.peopleGetInfo
              with:
                api_key: rest.api_key
                user_id: rest.user_id
              outputParameters:
                - type: object
                  mapping: $.
        - path: /v1/people/get-photos
          name: rest-flickr-people-getphotos
          description: REST surface for Get A User's Photos.
          operations:
            - method: GET
              name: peopleGetPhotos
              description: Get A User's Photos
              call: flickr-people.peopleGetPhotos
              with:
                api_key: rest.api_key
                user_id: rest.user_id
                extras: rest.extras
                page: rest.page
                per_page: rest.per_page
              outputParameters:
                - type: object
                  mapping: $.
        - path: /v1/people/find-by-email
          name: rest-flickr-people-findbyemail
          description: REST surface for Find User By Email.
          operations:
            - method: GET
              name: peopleFindByEmail
              description: Find User By Email
              call: flickr-people.peopleFindByEmail
              with:
                api_key: rest.api_key
                find_email: rest.find_email
              outputParameters:
                - type: object
                  mapping: $.
    - type: mcp
      namespace: flickr-people-mcp
      port: 9090
      transport: http
      description: MCP adapter for Flickr API — People. One tool per consumed operation, routed inline through this capability's consumes block.
      tools:
        - name: get-person-info
          description: Get Person Info
          hints:
            readOnly: true
            destructive: false
            idempotent: true
          call: flickr-people.peopleGetInfo
          with:
            api_key: tools.api_key
            user_id: tools.user_id
          outputParameters:
            - type: object
              mapping: $.
        - name: get-user-s-photos
          description: Get A User's Photos
          hints:
            readOnly: true
            destructive: false
            idempotent: true
          call: flickr-people.peopleGetPhotos
          with:
            api_key: tools.api_key
            user_id: tools.user_id
            extras: tools.extras
            page: tools.page
            per_page: tools.per_page
          outputParameters:
            - type: object
              mapping: $.
        - name: find-user-email
          description: Find User By Email
          hints:
            readOnly: true
            destructive: false
            idempotent: true
          call: flickr-people.peopleFindByEmail
          with:
            api_key: tools.api_key
            find_email: tools.find_email
          outputParameters:
            - type: object
              mapping: $.
