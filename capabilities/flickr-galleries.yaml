naftiko: 1.0.0-alpha2
info:
  label: Flickr API — Galleries
  description: "Photos — Galleries. 2 operations. Lead operation: List A User's Galleries. Self-contained Naftiko capability covering one Flickr business surface."
  tags:
    - Flickr
    - Photos
    - Galleries
  created: '2026-05-30'
  modified: '2026-05-30'
binds:
  - namespace: env
    keys:
      FLICKR_API_KEY: FLICKR_API_KEY
capability:
  consumes:
    - type: http
      namespace: flickr-galleries
      baseUri: https://api.flickr.com/services
      description: Flickr API — Galleries business capability. Self-contained, no shared references.
      authentication:
        type: apikey
        key: api_key
        value: '{{env.FLICKR_API_KEY}}'
        placement: query
      resources:
        - name: rest-flickr-galleries-getlist
          path: /rest/flickr.galleries.getList
          operations:
            - name: galleriesGetList
              method: GET
              description: List A User's Galleries
              inputParameters:
                - name: api_key
                  in: query
                  type: string
                  required: true
                  description: Application API key.
                - name: user_id
                  in: query
                  type: string
                  required: true
                  description: user_id
                - name: page
                  in: query
                  type: integer
                  required: false
                  description: page
                - name: per_page
                  in: query
                  type: integer
                  required: false
                  description: per_page
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: $.
        - name: rest-flickr-galleries-getphotos
          path: /rest/flickr.galleries.getPhotos
          operations:
            - name: galleriesGetPhotos
              method: GET
              description: List Photos In A Gallery
              inputParameters:
                - name: api_key
                  in: query
                  type: string
                  required: true
                  description: Application API key.
                - name: gallery_id
                  in: query
                  type: string
                  required: true
                  description: gallery_id
                - name: page
                  in: query
                  type: integer
                  required: false
                  description: page
                - name: per_page
                  in: query
                  type: integer
                  required: false
                  description: per_page
                - name: extras
                  in: query
                  type: string
                  required: false
                  description: Comma-delimited list of extra fields (e.g. owner_name, url_o, geo).
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: $.
  exposes:
    - type: rest
      namespace: flickr-galleries-rest
      port: 8080
      description: REST adapter for Flickr API — Galleries. One Spectral-compliant resource per consumed operation, prefixed with /v1.
      resources:
        - path: /v1/galleries/get-list
          name: rest-flickr-galleries-getlist
          description: REST surface for List A User's Galleries.
          operations:
            - method: GET
              name: galleriesGetList
              description: List A User's Galleries
              call: flickr-galleries.galleriesGetList
              with:
                api_key: rest.api_key
                user_id: rest.user_id
                page: rest.page
                per_page: rest.per_page
              outputParameters:
                - type: object
                  mapping: $.
        - path: /v1/galleries/get-photos
          name: rest-flickr-galleries-getphotos
          description: REST surface for List Photos In A Gallery.
          operations:
            - method: GET
              name: galleriesGetPhotos
              description: List Photos In A Gallery
              call: flickr-galleries.galleriesGetPhotos
              with:
                api_key: rest.api_key
                gallery_id: rest.gallery_id
                page: rest.page
                per_page: rest.per_page
                extras: rest.extras
              outputParameters:
                - type: object
                  mapping: $.
    - type: mcp
      namespace: flickr-galleries-mcp
      port: 9090
      transport: http
      description: MCP adapter for Flickr API — Galleries. One tool per consumed operation, routed inline through this capability's consumes block.
      tools:
        - name: list-user-s-galleries
          description: List A User's Galleries
          hints:
            readOnly: true
            destructive: false
            idempotent: true
          call: flickr-galleries.galleriesGetList
          with:
            api_key: tools.api_key
            user_id: tools.user_id
            page: tools.page
            per_page: tools.per_page
          outputParameters:
            - type: object
              mapping: $.
        - name: list-photos-gallery
          description: List Photos In A Gallery
          hints:
            readOnly: true
            destructive: false
            idempotent: true
          call: flickr-galleries.galleriesGetPhotos
          with:
            api_key: tools.api_key
            gallery_id: tools.gallery_id
            page: tools.page
            per_page: tools.per_page
            extras: tools.extras
          outputParameters:
            - type: object
              mapping: $.
