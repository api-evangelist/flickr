naftiko: 1.0.0-alpha2
info:
  label: Flickr API — Prefs
  description: 'Photos — Prefs. 1 operations. Lead operation: Get Default Privacy Preference. Self-contained Naftiko capability covering one Flickr business surface.'
  tags:
    - Flickr
    - Photos
    - Prefs
  created: '2026-05-30'
  modified: '2026-05-30'
binds:
  - namespace: env
    keys:
      FLICKR_API_KEY: FLICKR_API_KEY
capability:
  consumes:
    - type: http
      namespace: flickr-prefs
      baseUri: https://api.flickr.com/services
      description: Flickr API — Prefs business capability. Self-contained, no shared references.
      authentication:
        type: apikey
        key: api_key
        value: '{{env.FLICKR_API_KEY}}'
        placement: query
      resources:
        - name: rest-flickr-prefs-getprivacy
          path: /rest/flickr.prefs.getPrivacy
          operations:
            - name: prefsGetPrivacy
              method: GET
              description: Get Default Privacy Preference
              inputParameters:
                - name: api_key
                  in: query
                  type: string
                  required: true
                  description: Application API key.
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: $.
  exposes:
    - type: rest
      namespace: flickr-prefs-rest
      port: 8080
      description: REST adapter for Flickr API — Prefs. One Spectral-compliant resource per consumed operation, prefixed with /v1.
      resources:
        - path: /v1/prefs/get-privacy
          name: rest-flickr-prefs-getprivacy
          description: REST surface for Get Default Privacy Preference.
          operations:
            - method: GET
              name: prefsGetPrivacy
              description: Get Default Privacy Preference
              call: flickr-prefs.prefsGetPrivacy
              with:
                api_key: rest.api_key
              outputParameters:
                - type: object
                  mapping: $.
    - type: mcp
      namespace: flickr-prefs-mcp
      port: 9090
      transport: http
      description: MCP adapter for Flickr API — Prefs. One tool per consumed operation, routed inline through this capability's consumes block.
      tools:
        - name: get-default-privacy-preference
          description: Get Default Privacy Preference
          hints:
            readOnly: true
            destructive: false
            idempotent: true
          call: flickr-prefs.prefsGetPrivacy
          with:
            api_key: tools.api_key
          outputParameters:
            - type: object
              mapping: $.
