  /upload:
    post:
      operationId: photosUpload
      summary: Upload A Photo Or Video
      description: |
        Uploads a photo or video. Uses `https://up.flickr.com/services/upload`
        with a multipart/form-data POST. Returns the new photo ID (synchronous)
        or ticket ID (asynchronous).
      tags:
      - Photos Upload
      servers:
      - url: https://up.flickr.com/services
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photo]
              properties:
                photo:
                  type: string
                  format: binary
                title:
                  type: string
                description:
                  type: string
                tags:
                  type: string
                is_public:
                  type: integer
                is_friend:
                  type: integer
                is_family:
                  type: integer
                safety_level:
                  type: integer
                content_type:
                  type: integer
                hidden:
                  type: integer
                async:
                  type: integer
            examples:
              PhotosUploadRequestExample:
                summary: Default photosUpload request body
                x-microcks-default: true
                value:
                  photo: <binary>
                  title: Golden Gate Sunset
                  description: Detailed photo metadata.
                  tags: example
                  is_public: 1
                  is_friend: 1
                  is_family: 1
                  safety_level: 1
                  content_type: 1
                  hidden: 1
                  async: 1
      responses:
        '200':
          description: Upload response
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/UploadResponse'
              examples:
                PhotosUpload200Example:
                  summary: Default photosUpload 200 response
                  x-microcks-default: true
                  value:
                    stat: ok
                    photoid: '52345678901'
                    ticketid: '1234567'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
