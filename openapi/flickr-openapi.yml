components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: query
      name: api_key
      description: Application API key for non-authenticated and read-only public requests.
    OAuth1:
      type: oauth2
      description: |
        Flickr uses OAuth 1.0a (HMAC-SHA1). The OpenAPI 3 schema cannot model
        OAuth 1.0a directly, so this entry approximates the flow. Token URLs:
        - Request token: https://www.flickr.com/services/oauth/request_token
        - Authorize:     https://www.flickr.com/services/oauth/authorize
        - Access token:  https://www.flickr.com/services/oauth/access_token
      flows:
        authorizationCode:
          authorizationUrl: https://www.flickr.com/services/oauth/authorize
          tokenUrl: https://www.flickr.com/services/oauth/access_token
          scopes:
            read: Read access to private content owned by the user
            write: Modify content owned by the user
            delete: Delete content owned by the user
  parameters:
    Method:
      name: method
      in: query
      required: true
      description: Fully qualified flickr method, e.g. `flickr.photos.search`.
      schema:
        type: string
      example: flickr.photos.search
    ApiKey:
      name: api_key
      in: query
      required: true
      description: Application API key.
      schema:
        type: string
      example: ab1234567890cdef1234567890abcd12
    Format:
      name: format
      in: query
      description: Response format (json/xml/php_serial/rest).
      schema:
        type: string
        default: json
      example: json
    NoJsonCallback:
      name: nojsoncallback
      in: query
      description: Set to 1 to receive raw JSON instead of JSONP.
      schema:
        type: integer
        default: 1
      example: 1
    Page:
      name: page
      in: query
      schema:
        type: integer
        default: 1
      example: 1
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        default: 100
        maximum: 500
      example: 100
    UserId:
      name: user_id
      in: query
      required: true
      schema:
        type: string
      example: 12345678@N00
    UserIdOptional:
      name: user_id
      in: query
      schema:
        type: string
      example: 12345678@N00
    PhotoId:
      name: photo_id
      in: query
      required: true
      schema:
        type: string
      example: '52345678901'
    Extras:
      name: extras
      in: query
      description: Comma-delimited list of extra fields (e.g. owner_name, url_o, geo).
      schema:
        type: string
      example: owner_name,description,url_o,date_taken,geo
  responses:
    FlickrError:
      description: Flickr error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FlickrError'
  schemas:
    FlickrError:
      type: object
      properties:
        stat:
          type: string
          example: fail
        code:
          type: integer
          example: 100
        message:
          type: string
          example: Invalid API Key
    SuccessResponse:
      type: object
      properties:
        stat:
          type: string
          example: ok
    MethodResponse:
      type: object
      description: Generic method response (varies by method).
      additionalProperties: true
    Photo:
      type: object
      description: A photo.
      properties:
        id:
          type: string
          example: '52345678901'
        owner:
          type: string
          example: 12345678@N00
        secret:
          type: string
          example: abc1234def
        server:
          type: string
          example: '65535'
        farm:
          type: integer
          example: 66
        title:
          type: string
          example: Golden Gate Sunset
        ispublic:
          type: integer
          example: 1
        isfriend:
          type: integer
          example: 0
        isfamily:
          type: integer
          example: 0
        datetaken:
          type: string
          example: '2026-04-12 18:24:11'
        url_o:
          type: string
          format: uri
          example: https://live.staticflickr.com/65535/52345678901_abc1234def_o.jpg
        height_o:
          type: integer
          example: 4032
        width_o:
          type: integer
          example: 6048
    PhotoList:
      type: object
      properties:
        page:
          type: integer
          example: 1
